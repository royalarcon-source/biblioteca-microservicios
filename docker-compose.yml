services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biblioteca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biblioteca123}
      POSTGRES_DB: ${POSTGRES_DB:-biblioteca}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [biblioteca-net]

  books-service:
    build: ./books-service
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-biblioteca}:${POSTGRES_PASSWORD:-biblioteca123}@db:5432/${POSTGRES_DB:-biblioteca}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [biblioteca-net]
    # Sin "ports": solo el gateway es accesible desde fuera.

  gateway:
    build: ./gateway
    environment:
      BACKEND_URL: http://books-service:8000
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      RATE_LIMIT: ${RATE_LIMIT:-60}
    ports:
      - "8080:8000"
    depends_on:
      books-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [biblioteca-net]

networks:
  biblioteca-net:
    driver: bridge

volumes:
  pgdata:
